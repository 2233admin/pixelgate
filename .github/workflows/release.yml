name: release

# Publish to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# Push a tag `v<version>` matching package.json on a commit of main. This workflow tests that
# commit and packs it, stages the tarball on npm and drafts the GitHub release. A maintainer
# then approves the staged version on npmjs.com (Staged Packages, or `npm stage approve <id>`),
# which needs their 2FA (OIDC can stage but never approve), and publishes the draft release.
# See "Releasing" in README.md.
#
# npm's trusted-publisher config names this file (`release.yml`) and the `npm` environment:
# rename either one and publishing fails until the config is recreated on npmjs.com.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs the dev dependencies' code (install scripts, build, tests): no OIDC token here, so
  # nothing in it can talk to npm as this repository.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the main-ancestry check below

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Check tag and version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match package.json version ${version}"
            exit 1
          fi
          # A pre-release would land on the `latest` dist-tag.
          case "${version}" in
            *-*) echo "::error::pre-release ${version}: not supported by this workflow"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${tag} is not on main"
            exit 1
          fi
          if npm view "pixelgate-cli@${version}" version >/dev/null 2>&1; then
            echo "::error::pixelgate-cli@${version} is already on npm"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - run: pnpm typecheck

      # A tag can point at a commit CI never ran on.
      - run: pnpm test
        env:
          PIXELGATE_TEST_TMP: ${{ runner.temp }}

      # Lists the tarball's files in the log.
      - name: Pack
        run: |
          mkdir -p "${RUNNER_TEMP}/pack"
          npm pack --pack-destination "${RUNNER_TEMP}/pack"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC token: installs nothing and runs no package script, only npm itself.
  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Check npm
        shell: bash
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1, `npm stage` needs 11.15.0.
          npm --version
          node -e "
            const [a, b] = process.argv[1].split('.').map(Number);
            if (a < 11 || (a === 11 && b < 15)) {
              console.error('::error::npm ' + process.argv[1] + ' is older than 11.15.0');
              process.exit(1);
            }
          " "$(npm --version)"

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack

      - name: Stage on npm
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("${RUNNER_TEMP}"/pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one tarball, found ${#tarballs[@]}"
            exit 1
          fi
          npm stage publish --ignore-scripts "${tarballs[0]}"

  release:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      # A draft, so nothing public points at a version that is never approved on npm.
      - name: Draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "npm: [\`pixelgate-cli@${version}\`](https://www.npmjs.com/package/pixelgate-cli/v/${version})"
            echo
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes \
            --notes-file "${RUNNER_TEMP}/notes.md"
