name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: new upstream releases (latest-deps policy) and browser/OS image drift.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The next-Node row is an early warning, not a gate.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor of `engines` in package.json and of vitest/vite.
          - { os: ubuntu-latest, node: '22.18' }
          - { os: ubuntu-latest, node: lts/* }
          # `current` resolves to the next major's pre-release when there is no newer stable
          # (v27.0.0-alpha on 2026-11-16): useful to see breakage early, never blocking.
          - { os: ubuntu-latest, node: current, experimental: true }
          # Baselines are per platform; make sure every platform's paths and rendering work.
          - { os: windows-latest, node: lts/* }
          - { os: macos-latest, node: lts/* }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # Latest pnpm 12 (not pinned in package.json, so it never shows up as an outdated dependency).
      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps installs the Linux system libraries even when the browser itself is cached.
      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - run: pnpm typecheck

      # CI is set here, so pixelgate's own default is baseline mode `none`;
      # the tests pin the modes they exercise.
      - run: pnpm test
        env:
          PIXELGATE_TEST_TMP: ${{ runner.temp }}

      # What the Playwright Test e2e captured, to see a rendering difference.
      - name: Upload Playwright fixture output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-app-${{ strategy.job-index }}
          path: test/fixtures/playwright-app/.pixelgate/
          include-hidden-files: true
          if-no-files-found: ignore

  latest-deps:
    # Policy: every dependency on its latest release. Red here means "run pnpm deps:latest".
    name: dependencies are latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm deps:check

  explore:
    # `pixelgate explore` drives the vendored engine (engine/bombadil) against Playwright's
    # Chromium. Here the engine is required: a missing binary fails instead of skipping.
    # Also the guard against a Chromium bump breaking the engine's generated CDP bindings.
    name: explore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Cache engine binary
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: engine/bombadil/target/release/bombadil${{ runner.os == 'Windows' && '.exe' || '' }}
          key: engine-${{ runner.os }}-${{ hashFiles('engine/bombadil/**') }}

      # The version is pinned in engine/bombadil/rust-toolchain.toml.
      - if: steps.engine-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install
        working-directory: engine/bombadil

      - if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine/bombadil

      - if: steps.engine-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p bombadil-cli --no-default-features --locked
        working-directory: engine/bombadil

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - run: pnpm build

      - run: pnpm exec vitest run test/explore.unit.test.ts test/explore.e2e.test.ts
        env:
          PIXELGATE_ENGINE: ${{ github.workspace }}/engine/bombadil/target/release/bombadil${{ runner.os == 'Windows' && '.exe' || '' }}
          PIXELGATE_REQUIRE_ENGINE: '1'
          PIXELGATE_TEST_TMP: ${{ runner.temp }}

