# cargo-about config for the release's THIRD_PARTY_LICENSES.html (see .github/workflows/engine.yml).
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
  "CC0-1.0",
]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
# Bombadil's own workspace crates carry no license field; they are covered by its MIT
# LICENCE, quoted in the template and in THIRD_PARTY_NOTICES.
private = { ignore = true }
